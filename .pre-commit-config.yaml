# Root hooks: plugin checks (ruff, mypy, pytest) on push; commit-message lint on commit-msg.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: plugin-checks
        name: Run plugin checks (ruff, mypy, pytest)
        entry: scripts/run_plugin_checks.sh
        language: system
        pass_filenames: false
        files: '^taps/|^loaders/'
        stages: [pre-push]
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
