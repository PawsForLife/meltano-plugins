version: 1
send_anonymous_usage_stats: false
plugins:
  extractors:
    - name: tap-talon-one
      namespace: tap_talon_one
      pip_url: -e .
      capabilities:
        - catalog
        - discover
      settings:
        - name: api_url
          kind: string
        - name: management_key
          kind: password
        - name: application_id
          kind: integer
        - name: page_size
          kind: integer
        - name: start_date
          kind: date_iso8601
        - name: lookback_minutes
          kind: integer
