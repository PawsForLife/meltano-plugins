[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap-talon-one"
version = "0.2.0"
description = "Singer tap for the Talon.One Management API."
readme = "README.md"
requires-python = ">=3.12,<4"
license = "Apache-2.0"
dependencies = [
    "requests>=2.32,<3",
    "singer-sdk>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "requests-mock>=1.12,<2",
    "ruff>=0.8,<1",
    "types-requests>=2.32,<3",
]

[project.scripts]
tap-talon-one = "tap_talon_one.tap:TalonOneTap.cli"

[tool.hatch.build.targets.wheel]
packages = ["tap_talon_one"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
