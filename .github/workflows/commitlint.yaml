name: Lint Commit Messages
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate relaxed commitlint config
        run: |
          cat > $GITHUB_WORKSPACE/commitlint.config.mjs << 'EOF'
          const Configuration = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'subject-case': [1, 'never'],
            }
          }
          export default Configuration
          EOF
      # Mirrors PawsForLife/puggle's commitlint-variant.yaml inline because this repo is public
      # and cannot call that private workflow. Temporary: remove continue-on-error once the
      # commit-lint rules are approved and followed.
      - uses: wagoid/commitlint-github-action@v6
        continue-on-error: true
