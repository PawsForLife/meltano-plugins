# Create version tags for plugins whose project.version changed on merge to release (path filter:
# pyproject.toml under taps/loaders). Tag format: {plugin-name}/v{version}. Skips if tag exists.
name: Plugin tag on release

on:
  push:
    branches: [release]
    paths:
      - "taps/**/pyproject.toml"
      - "loaders/**/pyproject.toml"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run plugin package discovery and set matrix output
        id: discover
        run: |
          echo "packages<<EOF" >> "$GITHUB_OUTPUT"
          python scripts/list_packages.py --json . \
            --git-before "${{ github.event.before }}" \
            --git-after "${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  tag:
    needs: discover
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.packages) }}
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and create tag
        run: |
          PLUGIN=$(echo "${{ matrix.path }}" | sed 's|.*/||')
          VERSION=$(python3 -c "
          import tomllib
          import sys
          with open(sys.argv[1], 'rb') as f:
              data = tomllib.load(f)
              print(data['project']['version'])
          " "${{ matrix.path }}/pyproject.toml")
          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid or empty VERSION: '$VERSION' (expected semver-like x.y.z)"
            exit 1
          fi
          TAG="${PLUGIN}/v${VERSION}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "${PLUGIN} ${VERSION}"
          git push origin "$TAG"
